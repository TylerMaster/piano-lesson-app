# ── Server ───────────────────────────────────────────────────────────────────
server.port=8083
# Include the exception reason from ResponseStatusException in the JSON error
# body's "message" field.  Without this, Spring Boot 3 omits the message
# (the default is "never"), so the mobile client receives an empty string
# and cannot display a meaningful error to the user.
server.error.include-message=always

# ── Database ─────────────────────────────────────────────────────────────────
# Spring Boot connects to PostgreSQL through the host port (5434) because the
# Spring Boot process runs on your machine, outside Docker.  Inside the
# container the database is on its default port 5432, but we can't use that
# from outside — we always use the mapped host port 5434.
spring.datasource.url=jdbc:postgresql://localhost:5434/piano_lessons
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# ddl-auto=update: Hibernate compares your entity classes to the existing
# database schema on startup and applies any missing tables or columns.
# It never drops data.  Good for development; use 'validate' or a migration
# tool (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Disable the default "open session in view" pattern — it's not needed here
# and Spring warns about it on every startup if left unset.
spring.jpa.open-in-view=false

# ── JSON ─────────────────────────────────────────────────────────────────────
# Write Instant/LocalDateTime as ISO 8601 strings ("2024-11-04T10:00:00Z")
# rather than numeric timestamps.  The mobile app produces ISO 8601 dates, so
# keeping the same format makes the API easier to work with.
spring.jackson.serialization.write-dates-as-timestamps=false

# ── File upload limits ───────────────────────────────────────────────────────
# Spring Boot defaults to 1 MB per file and 10 MB per request.  Lesson
# recordings can easily exceed both.  2 GB covers any realistic recording
# length while keeping the limit defined and explicit.
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ── Transcription service ────────────────────────────────────────────────────
# The Python FastAPI service started with:
#   WHISPER_MODEL=tiny uvicorn main:app --host 0.0.0.0 --port 8000
transcription.service.url=${TRANSCRIPTION_SERVICE_URL:http://localhost:8000}

# ── Audio file storage ───────────────────────────────────────────────────────
# Directory where uploaded audio files are saved.  Relative paths are resolved
# from the working directory where you start Spring Boot (typically backend/).
storage.audio.directory=${AUDIO_STORAGE_DIR:./audio-uploads}

# ── Email (Resend) ───────────────────────────────────────────────────────────
resend.api-url=https://api.resend.com/emails
# Sender shown to recipients.  Replace with a verified custom domain once
# domain verification is complete in the Resend dashboard.
resend.from-address=Piano Lesson Companion <onboarding@resend.dev>
# API key: supply via the RESEND_API_KEY environment variable, or set
# resend.api-key directly in application-local.properties.  Never commit here.
resend.api-key=${RESEND_API_KEY:}

# ── AI Summarization (Anthropic Claude) ──────────────────────────────────────
ai.summarization.api-url=https://api.anthropic.com/v1/messages
ai.summarization.model=claude-haiku-4-5-20251001
# How long to wait for the Anthropic API to return a complete response.
# AI calls can be slow for long transcripts; 60 s is a safe default for Haiku.
ai.summarization.timeout-seconds=60
# API key: supply via the AI_SUMMARIZATION_API_KEY environment variable,
# or set ai.summarization.api-key directly in application-local.properties.
# Never commit a real key here.
ai.summarization.api-key=${AI_SUMMARIZATION_API_KEY:}
